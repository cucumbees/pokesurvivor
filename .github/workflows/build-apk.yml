name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Salin file web ke www/
        run: |
          mkdir -p www
          cp -r index.html css js assets manifest.webmanifest sw.js www/

      - name: Bahasa default Inggris
        run: |
          sed -i 's#<script defer src="js/app.min.js#<script>try{if(!localStorage.getItem("ps.lang"))localStorage.setItem("ps.lang","en")}catch(e){}</script><script defer src="js/app.min.js#' www/index.html
          grep -c 'ps.lang' www/index.html

      - run: npm install
      - run: npx cap add android

      - name: Paksa mode landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
